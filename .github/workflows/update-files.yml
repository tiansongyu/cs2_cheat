name: Update CS2 Offset Files

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Re-download the current cs2-dumper revision'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-cs2-offset-files
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
      published_sha: ${{ steps.publish.outputs.published_sha }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    - name: Resolve cs2-dumper revision
      id: revision
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FORCE_UPDATE: ${{ inputs.force_update }}
      run: |
        set -euo pipefail
        latest_commit="$(gh api repos/a2x/cs2-dumper/commits/main --jq '.sha')"
        last_commit="$(cat last_commit.txt 2>/dev/null || true)"

        echo "Latest commit: $latest_commit"
        echo "Recorded commit: ${last_commit:-none}"
        echo "sha=$latest_commit" >> "$GITHUB_OUTPUT"

        if [[ "$FORCE_UPDATE" == "true" || "$latest_commit" != "$last_commit" ]]; then
          echo "download=true" >> "$GITHUB_OUTPUT"
        else
          echo "download=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download generated headers at pinned revision
      if: steps.revision.outputs.download == 'true'
      env:
        REVISION: ${{ steps.revision.outputs.sha }}
      run: |
        set -euo pipefail
        base_url="https://raw.githubusercontent.com/a2x/cs2-dumper/${REVISION}/output"
        curl --fail --location --retry 3 --output external-cheat-base/generated/client_dll.hpp "${base_url}/client_dll.hpp"
        curl --fail --location --retry 3 --output external-cheat-base/generated/offsets.hpp "${base_url}/offsets.hpp"
        curl --fail --location --retry 3 --output external-cheat-base/generated/buttons.hpp "${base_url}/buttons.hpp"
        printf '%s' "$REVISION" > last_commit.txt

    - name: Validate generated headers before publishing
      if: steps.revision.outputs.download == 'true'
      run: |
        set -euo pipefail
        docker build --target artifacts .

    - name: Commit and push changes
      id: publish
      if: steps.revision.outputs.download == 'true'
      env:
        REVISION: ${{ steps.revision.outputs.sha }}
      run: |
        set -euo pipefail
        git add external-cheat-base/generated/client_dll.hpp external-cheat-base/generated/offsets.hpp external-cheat-base/generated/buttons.hpp last_commit.txt
        if git diff --cached --quiet; then
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git commit -m "Update CS2 offsets to ${REVISION:0:12}"
        for attempt in 1 2 3; do
          git pull --rebase origin main
          if git push origin HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Push attempt $attempt failed; retrying after rebase"
        done
        echo "Unable to publish offset update after three attempts" >&2
        exit 1

  trigger-build:
    needs: update-files
    if: needs.update-files.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Build Workflow
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SOURCE_SHA: ${{ needs.update-files.outputs.published_sha }}
      run: |
        gh workflow run build.yaml \
          --repo "${{ github.repository }}" \
          --ref main \
          -f force_build=true \
          -f source_sha="$SOURCE_SHA"
