name: Build CS2 ESP (SDL2 + ImGui)

on:
  # 由 update-files.yml 触发，或手动触发
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build'
        required: false
        type: boolean
        default: true
      source_sha:
        description: 'Exact commit to build (used by the offset updater)'
        required: false
        type: string
        default: ''
  # 当 push 到 main 分支时也触发（用于代码更新后的构建）
  push:
    branches: [ main ]
    paths:
      - 'external-cheat-base/**'
      - 'tests/**'
      - 'web-radar/**'
      - 'radar-relay/**'
      - 'deploy/public-relay/**'
      - 'docs/public-radar-relay-design.md'
      - 'vendor/civetweb/**'
      - 'scripts/sync_web_radar_maps.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - '.github/workflows/build.yaml'
      - '!external-cheat-base/generated/**'

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - name: Build viewport regression tests
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror \
          -Iexternal-cheat-base/src \
          tests/viewport_math_tests.cpp \
          -o viewport_math_tests
    - name: Run viewport regression tests
      run: ./viewport_math_tests
    - name: Build Web Radar model regression tests
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror \
          -Iexternal-cheat-base/src \
          tests/web_radar_model_tests.cpp \
          external-cheat-base/src/core/game/web_radar_json.cpp \
          -o web_radar_model_tests
    - name: Run Web Radar model regression tests
      run: ./web_radar_model_tests
    - name: Build and run Public Relay producer configuration tests
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
          -Iexternal-cheat-base/src \
          external-cheat-base/src/features/web_radar/tests/public_relay_config_tests.cpp \
          -o public_relay_config_tests
        ./public_relay_config_tests
    - name: Build and run embedded service smoke tests
      run: |
        mkdir -p /tmp/web-radar-smoke
        gcc -std=c11 -O2 \
          -DNO_SSL -DNO_CGI -DUSE_WEBSOCKET -DUSE_IPV6 \
          -Ivendor/civetweb/include \
          -c vendor/civetweb/src/civetweb.c \
          -o /tmp/web-radar-smoke/civetweb.o
        g++ -std=c++20 -O2 \
          -DNO_SSL -DNO_CGI -DUSE_WEBSOCKET -DUSE_IPV6 \
          -Ivendor/civetweb/include \
          -c vendor/civetweb/src/CivetServer.cpp \
          -o /tmp/web-radar-smoke/CivetServer.o
        g++ -std=c++20 -O2 -Wall -Wextra -Werror \
          -DNO_SSL -DNO_CGI -DUSE_WEBSOCKET -DUSE_IPV6 \
          -Ivendor/civetweb/include \
          -Iexternal-cheat-base/src \
          -Iexternal-cheat-base/src/features/web_radar \
          external-cheat-base/src/features/web_radar/tests/web_radar_service_smoke_tests.cpp \
          external-cheat-base/src/features/web_radar/web_radar_service.cpp \
          /tmp/web-radar-smoke/civetweb.o \
          /tmp/web-radar-smoke/CivetServer.o \
          -pthread -ldl \
          -o /tmp/web-radar-smoke/web_radar_service_smoke_tests
        /tmp/web-radar-smoke/web_radar_service_smoke_tests
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web-radar/package-lock.json
    - name: Test and build Web Radar frontend
      working-directory: web-radar
      run: |
        npm ci
        npm test
        npm run build
    - name: Upload Web Radar static bundle
      uses: actions/upload-artifact@v4
      with:
        name: web-radar-static
        path: web-radar/dist
        if-no-files-found: error
        retention-days: 1

  public-relay-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: radar-relay/go.mod
        cache-dependency-path: radar-relay/go.sum
    - name: Test public deployment credential generator
      working-directory: radar-relay
      run: |
        go build -mod=vendor -trimpath -o "$RUNNER_TEMP/radar-relay" ./cmd/radar-relay
        RADAR_RELAY_BIN="$RUNNER_TEMP/radar-relay" \
          ../deploy/public-relay/tests/generate-room-config_test.sh \
          ../deploy/public-relay/generate-room-config.sh
    - name: Test Radar Relay with race detector
      working-directory: radar-relay
      run: go test -mod=vendor -race ./...
    - name: Vet Radar Relay
      working-directory: radar-relay
      run: go vet -mod=vendor ./...
    - name: Scan Radar Relay for known Go vulnerabilities
      working-directory: radar-relay
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
    - name: Build production Radar Relay image
      run: docker build -f radar-relay/Dockerfile -t cs2-radar-relay:ci .
    - name: Build and verify capability-free Caddy image
      run: |
        docker build \
          -f deploy/public-relay/Caddy.Dockerfile \
          -t cs2-radar-caddy:ci \
          deploy/public-relay
        docker run --rm \
          --user 65532:65532 \
          --cap-drop ALL \
          --security-opt no-new-privileges \
          cs2-radar-caddy:ci caddy version
        docker run --rm \
          -e RADAR_DOMAIN=radar.example.com \
          -e ACME_EMAIL=admin@example.net \
          -v "$PWD/deploy/public-relay/Caddyfile:/etc/caddy/Caddyfile:ro" \
          cs2-radar-caddy:ci \
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    - name: Validate public deployment configuration
      run: |
        shellcheck \
          deploy/public-relay/generate-room-config.sh \
          deploy/public-relay/tests/generate-room-config_test.sh \
          deploy/public-relay/verify-deployment.sh
        RELAY_CONFIG_FILE=./relay-config.example.json docker compose \
          --env-file deploy/public-relay/.env.example \
          -f deploy/public-relay/compose.yaml \
          config --quiet

  build:
    needs: [unit-tests, public-relay-tests]
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.source_sha || github.sha }}

    - name: Download Web Radar static bundle
      uses: actions/download-artifact@v4
      with:
        name: web-radar-static
        path: web-radar/dist

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build Solution
      shell: cmd
      run: |
        msbuild external-cheat-base.sln /p:Configuration=Release /p:Platform=x64

    - name: Verify release layout
      shell: pwsh
      run: |
        $required = @(
          "x64/Release/external-cheat-base.exe",
          "x64/Release/SDL2.dll",
          "x64/Release/web-radar/dist/index.html",
          "x64/Release/web-radar/dist/maps/manifest.json",
          "x64/Release/CIVETWEB-LICENSE.md"
        )
        foreach ($path in $required) {
          if (-not (Test-Path $path)) {
            throw "Missing release artifact: $path"
          }
        }

    - name: Compress Release Artifacts
      run: |
        powershell Compress-Archive -Path x64/Release/* -DestinationPath x64/Release/Release-Binaries.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Release-Binaries
        path: x64/Release/Release-Binaries.zip

    - name: Create Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "v2.0.${{ github.run_number }}.${{ github.run_attempt }}"
        gh release create $tag `
          "x64/Release/Release-Binaries.zip#Release-Binaries.zip" `
          --target "${{ inputs.source_sha || github.sha }}" `
          --title "Release $tag (SDL2 + ImGui)" `
          --generate-notes
